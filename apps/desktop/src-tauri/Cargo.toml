[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Desktop shell for dsh (@deepseek-ai/dsh)"
edition = "2021"

[lib]
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools` enables WKWebView inspection in RELEASE builds (wry compiles
# set_inspectable only under debug_assertions or this feature) — needed for
# the page-side diagnostics of the second-click issue; harmless otherwise.
tauri = { version = "2", features = ["tray-icon", "image-png", "devtools"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ctrlc = "3"
libc = "0.2"
zip = "8.6.0"
tauri-plugin-single-instance = "2.4.3"
tauri-plugin-opener = "2.5.4"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"
tauri-plugin-notification = "2.3.3"
tokio = { version = "1.53.1", features = ["time"] }
semver = { version = "1.0.28", features = ["serde"] }
objc2-user-notifications = "0.3.2"
block2 = "0.6.2"
